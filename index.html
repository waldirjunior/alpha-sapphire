<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Alpha Sapphire — Three.js Engine (TCC)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b132b;
        font-family: system-ui, -apple-system, sans-serif;
        color: #f8fafc;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(11, 19, 43, 0.78);
        border: 1px solid rgba(56, 189, 248, 0.35);
        font-size: 13px;
        line-height: 1.5;
        pointer-events: auto;
      }
      #starter-bar {
        margin-top: 6px;
        display: none;
        gap: 6px;
        align-items: center;
      }
      #starter-bar.debug-open {
        display: flex;
      }
      #starter-bar button {
        padding: 3px 8px;
        border-radius: 6px;
        border: 1px solid rgba(56, 189, 248, 0.5);
        background: #1e293b;
        color: #f8fafc;
        font-size: 12px;
        cursor: pointer;
      }
      #starter-bar button.active {
        background: #0284c7;
        border-color: #38bdf8;
      }
      #hud strong {
        color: #38bdf8;
      }
      #dialogue-box {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: min(640px, calc(100% - 32px));
        padding: 16px 20px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.94);
        border: 2px solid #38bdf8;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-line;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }
      #dialogue-box.open {
        display: block;
      }
      #battle-overlay {
        display: none;
        position: fixed;
        inset: 0;
        pointer-events: none;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 20px;
        z-index: 20;
      }
      #battle-overlay.open {
        display: flex;
      }
      #battle-card {
        pointer-events: auto;
        width: min(620px, calc(100% - 32px));
        padding: 16px 20px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.9);
        border: 2px solid #f59e0b;
        display: grid;
        gap: 10px;
      }
      .battle-row {
        display: flex;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: 8px;
        background: #1e293b;
      }
      #battle-log {
        min-height: 76px;
        max-height: 120px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.5;
        color: #cbd5e1;
      }
      #battle-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #battle-actions button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #38bdf8;
        background: #1e293b;
        color: #f8fafc;
        cursor: pointer;
        font-weight: 600;
      }
      #battle-actions button:hover {
        background: #0284c7;
      }
      .hp-bar-track {
        width: 120px;
        height: 8px;
        border-radius: 999px;
        background: #0f172a;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.35);
      }
      .hp-bar-fill {
        height: 100%;
        transition: width 0.2s ease;
      }
      #ds-menu {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        z-index: 15;
      }
      #ds-tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      #ds-tabs button,
      #ds-panel button {
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid rgba(56, 189, 248, 0.45);
        background: rgba(15, 23, 42, 0.88);
        color: #f8fafc;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      #ds-tabs button.active {
        background: #0284c7;
        border-color: #7dd3fc;
      }
      #ds-panel {
        display: none;
        width: min(320px, calc(100vw - 24px));
        max-height: 60vh;
        overflow-y: auto;
        padding: 12px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid rgba(56, 189, 248, 0.5);
        font-size: 12px;
        line-height: 1.5;
        gap: 8px;
      }
      #ds-panel.open {
        display: grid;
      }
      .ds-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border-radius: 8px;
        background: #1e293b;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div><strong>Alpha Sapphire Web (Three.js)</strong> — v0.1.0</div>
      <div id="hud-pos">Mapa: littleroot_town | Pos: (20, 14)</div>
      <div>Controles: WASD/Setas para mover · Espaço/Enter para interagir</div>
      <div id="starter-bar">
        <span>Inicial:</span>
        <button data-starter="treecko">Treecko</button>
        <button data-starter="torchic" class="active">Torchic</button>
        <button data-starter="mudkip">Mudkip</button>
        <button id="reset-save" title="Apagar save local">Resetar Save</button>
      </div>
    </div>
    <div id="ds-menu">
      <div id="ds-tabs">
        <button data-tab="party">Time</button>
        <button data-tab="bag">Mochila</button>
        <button data-tab="pokedex">Pokédex</button>
        <button id="btn-save-game">Salvar</button>
      </div>
      <div id="ds-panel" role="region" aria-label="Menu do Treinador"></div>
    </div>
    <div id="dialogue-box" role="dialog" aria-live="polite"></div>
    <div id="battle-overlay" role="dialog" aria-modal="true">
      <div id="battle-card">
        <div class="battle-row" id="battle-enemy"></div>
        <div class="battle-row" id="battle-player"></div>
        <div id="battle-log"></div>
        <div id="battle-actions"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
