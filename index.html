<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Alpha Sapphire — Three.js Engine (TCC)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b132b;
        font-family: system-ui, -apple-system, sans-serif;
        color: #f8fafc;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(11, 19, 43, 0.78);
        border: 1px solid rgba(56, 189, 248, 0.35);
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
      }
      #hud strong {
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div><strong>Alpha Sapphire Web (Three.js)</strong> — v0.1.0</div>
      <div id="hud-pos">Mapa: littleroot_town | Pos: (0, 0)</div>
      <div>Controles: WASD ou Setas para mover</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
