<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Alpha Sapphire — Three.js Engine (TCC)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b132b;
        font-family: system-ui, -apple-system, sans-serif;
        color: #f8fafc;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(11, 19, 43, 0.78);
        border: 1px solid rgba(56, 189, 248, 0.35);
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
      }
      #hud strong {
        color: #38bdf8;
      }
      #dialogue-box {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: min(640px, calc(100% - 32px));
        padding: 16px 20px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.94);
        border: 2px solid #38bdf8;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-line;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }
      #dialogue-box.open {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div><strong>Alpha Sapphire Web (Three.js)</strong> — v0.1.0</div>
      <div id="hud-pos">Mapa: littleroot_town | Pos: (20, 14)</div>
      <div>Controles: WASD/Setas para mover · Espaço/Enter para interagir</div>
    </div>
    <div id="dialogue-box" role="dialog" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
