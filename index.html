<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Alpha Sapphire — Three.js Engine (TCC)</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%230284c7' d='M8 2h16l7 10-15 19L1 12Z'/%3E%3Cpath fill='%237dd3fc' d='m8 2 8 29 8-29-8 10Z'/%3E%3C/svg%3E" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060b19;
        font-family: system-ui, -apple-system, sans-serif;
        color: #f8fafc;
      }
      #ds-shell {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-rows: 1fr auto;
      }
      #top-screen {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #location-banner {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 7px 14px;
        border-radius: 6px 16px 6px 6px;
        background: linear-gradient(135deg, rgba(14, 116, 144, 0.92), rgba(15, 23, 42, 0.92));
        border: 1px solid rgba(125, 211, 252, 0.55);
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
      #starter-bar {
        display: none;
        position: absolute;
        top: 52px;
        left: 12px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.85);
        gap: 6px;
        align-items: center;
        font-size: 12px;
      }
      #starter-bar.debug-open {
        display: flex;
      }
      #starter-bar button {
        padding: 3px 8px;
        border-radius: 6px;
        border: 1px solid #38bdf8;
        background: #1e293b;
        color: #f8fafc;
        font-size: 12px;
        cursor: pointer;
      }
      #starter-bar button.active {
        background: #0284c7;
      }
      #bottom-screen {
        background: linear-gradient(180deg, #0f1c3f 0%, #091229 100%);
        border-top: 3px solid #1d4ed8;
        padding: 10px 14px;
        display: grid;
        gap: 10px;
        z-index: 15;
      }
      #playnav-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      #playnav-info {
        font-size: 12px;
        color: #93c5fd;
      }
      #ds-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      #ds-tabs button,
      #ds-panel button {
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid rgba(96, 165, 250, 0.55);
        background: linear-gradient(180deg, #1e3a8a, #172554);
        color: #f8fafc;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      #ds-tabs button.active {
        background: linear-gradient(180deg, #0284c7, #0369a1);
        border-color: #7dd3fc;
      }
      #ds-panel {
        display: none;
        max-height: 220px;
        overflow-y: auto;
        padding: 10px;
        border-radius: 10px;
        background: rgba(9, 17, 38, 0.92);
        border: 1px solid rgba(56, 189, 248, 0.45);
        font-size: 12px;
      }
      #ds-panel.open {
        display: block;
      }
      .oras-party-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
        gap: 8px;
      }
      .oras-party-card {
        padding: 8px 10px;
        border-radius: 8px;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        border: 1px solid #334155;
        display: grid;
        gap: 4px;
      }
      .oras-party-card.lead {
        border-color: #38bdf8;
      }
      .oras-bag-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .oras-bag-tabs button.active {
        background: #0284c7;
      }
      .oras-dex-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
      }
      .ds-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #1e293b;
        border: 1px solid #334155;
      }
      .ds-item.caught {
        border-color: #22c55e;
      }
      .hp-bar-track {
        width: 100%;
        min-width: 90px;
        height: 8px;
        border-radius: 999px;
        background: #0f172a;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.35);
      }
      .hp-bar-fill {
        height: 100%;
        transition: width 0.2s ease;
      }
      #dialogue-box {
        display: none;
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: min(640px, calc(100% - 32px));
        padding: 16px 20px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.95);
        border: 2px solid #38bdf8;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-line;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        z-index: 18;
      }
      #dialogue-box.open {
        display: block;
      }
      #battle-overlay,
      #intro-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(6, 11, 25, 0.85);
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 30;
      }
      #battle-overlay {
        background: transparent;
        pointer-events: none;
        align-items: flex-end;
      }
      #battle-overlay.open,
      #intro-overlay.open {
        display: flex;
      }
      #battle-card,
      #intro-card {
        pointer-events: auto;
        width: min(620px, calc(100% - 24px));
        padding: 20px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.96);
        border: 2px solid #38bdf8;
        display: grid;
        gap: 12px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      }
      #battle-card {
        border-color: #f59e0b;
      }
      .intro-genders {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .intro-gender-btn {
        padding: 12px;
        border-radius: 10px;
        border: 2px solid #334155;
        background: #1e293b;
        color: #f8fafc;
        font-weight: 700;
        cursor: pointer;
      }
      .intro-gender-btn.active {
        border-color: #38bdf8;
        background: #0369a1;
      }
      #intro-name {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #f8fafc;
        font-size: 14px;
      }
      .intro-primary-btn {
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid #38bdf8;
        background: #0284c7;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      @keyframes truckShake {
        0%,
        100% {
          transform: translateY(0);
        }
        25% {
          transform: translate(-3px, 2px);
        }
        75% {
          transform: translate(3px, -2px);
        }
      }
      .truck-shaking {
        animation: truckShake 0.45s infinite;
      }
      .battle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #1e293b;
      }
      #battle-log {
        min-height: 70px;
        max-height: 110px;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.5;
        color: #cbd5e1;
      }
      #battle-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #battle-actions button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #38bdf8;
        background: #1e293b;
        color: #f8fafc;
        cursor: pointer;
        font-weight: 600;
      }
      #battle-actions button:hover {
        background: #0284c7;
      }
    </style>
  </head>
  <body>
    <div id="ds-shell">
      <div id="top-screen">
        <div id="app"></div>
        <div id="location-banner"><span id="hud-pos">Littleroot Town</span></div>
        <div id="starter-bar">
          <span>Debug Inicial:</span>
          <button data-starter="treecko">Treecko</button>
          <button data-starter="torchic" class="active">Torchic</button>
          <button data-starter="mudkip">Mudkip</button>
          <button id="reset-save" title="Apagar save local">Resetar Save</button>
        </div>
        <div id="dialogue-box" role="dialog" aria-live="polite"></div>
      </div>

      <div id="bottom-screen">
        <div id="playnav-bar">
          <div id="playnav-info">PlayNav — WASD/Setas para mover · Espaço/Enter para interagir</div>
          <div id="ds-tabs">
            <button data-tab="party">Equipe (Party)</button>
            <button data-tab="bag">Mochila (Bag)</button>
            <button data-tab="pokedex">Pokédex Hoenn</button>
            <button id="btn-save-game">Salvar Jogo</button>
            <button id="btn-new-game">Novo Jogo</button>
          </div>
        </div>
        <div id="ds-panel" role="region" aria-label="Tela Inferior 3DS"></div>
      </div>
    </div>

    <div id="intro-overlay" role="dialog" aria-modal="true">
      <div id="intro-card"></div>
    </div>

    <div id="battle-overlay" role="dialog" aria-modal="true">
      <div id="battle-card">
        <div class="battle-row" id="battle-enemy"></div>
        <div class="battle-row" id="battle-player"></div>
        <div id="battle-log"></div>
        <div id="battle-actions"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
