<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Alpha Sapphire — Three.js Engine (TCC)</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%230284c7' d='M8 2h16l7 10-15 19L1 12Z'/%3E%3Cpath fill='%237dd3fc' d='m8 2 8 29 8-29-8 10Z'/%3E%3C/svg%3E" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html,
      body {
        width: 100%; height: 100%; overflow: hidden;
        background: #07172d;
        font-family: system-ui, -apple-system, sans-serif; color: #f8fafc;
      }
      #ds-shell {
        width: 100%; height: 100%; display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
      }
      #top-screen {
        position: relative; width: 100%; height: 100%; overflow: hidden;
      }
      #app { width: 100%; height: 100%; }
      #location-banner {
        position: absolute; top: 12px; left: 12px; padding: 7px 14px;
        border-radius: 12px 5px 12px 5px;
        background: linear-gradient(135deg, rgba(9, 57, 106, 0.88), rgba(10, 30, 62, 0.92));
        border: 1px solid rgba(191, 230, 255, 0.65);
        font-size: 13px; font-weight: 600;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(8px);
      }
      #starter-bar {
        display: none; position: absolute; top: 52px; left: 12px;
        padding: 6px 10px; border-radius: 8px;
        background: rgba(8, 23, 48, 0.92);
        border: 1px solid rgba(125, 211, 252, 0.55);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        gap: 6px; align-items: center; font-size: 12px;
      }
      #starter-bar.debug-open { display: flex; }
      #starter-bar button {
        padding: 3px 8px; border-radius: 6px; border: 1px solid #38bdf8;
        background: #1e293b; color: #f8fafc; font-size: 12px; cursor: pointer;
      }
      #starter-bar button.active { background: #0284c7; }
      #bottom-screen {
        background: linear-gradient(150deg, #e9f7ff 0%, #c6e7f7 48%, #a8cee8 100%);
        border-top: 5px solid #244d7b; padding: 10px 16px 12px;
        display: grid; gap: 8px; z-index: 15;
        box-shadow: 0 -8px 24px rgba(2, 16, 39, 0.35), inset 0 1px rgba(255, 255, 255, 0.85);
      }
      #playnav-bar {
        display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
        gap: 8px 14px;
      }
      #playnav-info {
        font-size: 11px; color: #34577e; font-weight: 700;
        letter-spacing: 0.04em;
      }
      #audio-controls {
        display: flex; align-items: center; gap: 7px;
        color: #34577e; font-size: 11px; font-weight: 700;
      }
      #audio-volume {
        width: clamp(76px, 10vw, 118px);
        accent-color: #176eb1;
      }
      #audio-volume-value { min-width: 34px; }
      #audio-controls button {
        padding: 5px 9px; border: 1px solid rgba(63, 110, 158, 0.55);
        border-radius: 9px; background: linear-gradient(180deg, #fff, #d9efff);
        color: #17395f; font-size: 11px; font-weight: 700; cursor: pointer;
      }
      #ds-tabs {
        display: flex; align-items: stretch; gap: 7px;
        flex-wrap: wrap;
      }
      #ds-tabs button,
      #ds-panel button {
        padding: 6px 12px; border-radius: 12px;
        border: 1px solid rgba(63, 110, 158, 0.45);
        background: linear-gradient(180deg, #fff, #d9efff);
        color: #17395f;
        font-size: 11px; font-weight: 700; cursor: pointer;
        box-shadow: 0 3px 7px rgba(25, 62, 101, 0.18), inset 0 1px #fff;
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }
      #ds-tabs button {
        min-width: 82px;
        min-height: 58px;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 2px;
      }
      .menu-icon {
        display: grid;
        place-items: center;
        width: 25px;
        height: 25px;
        border-radius: 8px;
        color: #fff;
        background: linear-gradient(145deg, #399ee8, #1765ad);
        font-size: 17px;
        line-height: 1;
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.48);
      }
      #ds-tabs button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(25, 62, 101, 0.24), inset 0 1px #fff;
      }
      #ds-tabs button.active {
        background: linear-gradient(180deg, #278bd1, #1764a8);
        border-color: #79caff;
        color: #fff;
        box-shadow: 0 4px 12px rgba(16, 80, 137, 0.35), inset 0 1px rgba(255, 255, 255, 0.38);
      }
      #ds-tabs button.active .menu-icon {
        color: #1e4d7c;
        background: linear-gradient(145deg, #fff, #d4edff);
      }
      #btn-save-game .menu-icon {
        background: linear-gradient(145deg, #ffb44c, #e36c25);
      }
      #btn-new-game {
        min-height: 42px;
        background: linear-gradient(180deg, #f4f8fc, #d2dfeb);
        color: #405771;
      }
      #ds-panel {
        display: none;
        max-height: clamp(82px, 16vh, 134px);
        overflow-y: auto;
        padding: 8px;
        border-radius: 13px;
        background: rgba(8, 28, 58, 0.95);
        border: 1px solid rgba(76, 166, 231, 0.7);
        font-size: 12px;
        box-shadow: inset 0 1px 8px rgba(0, 0, 0, 0.22), 0 4px 12px rgba(15, 48, 80, 0.18);
      }
      #ds-panel.open {
        display: block;
      }
      #ds-panel.hoenn-map-open {
        max-height: clamp(220px, 36vh, 340px);
      }
      .oras-hoenn-map {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(145px, 1fr);
        align-items: stretch;
        gap: 10px;
      }
      .hoenn-map-svg {
        width: 100%;
        height: 185px;
        border-radius: 10px;
        background: radial-gradient(ellipse at 48% 46%, #164966, #0b2944 68%);
      }
      .hoenn-map-land {
        fill: #5b9b74;
        stroke: #a7d99a;
        stroke-width: 3;
        stroke-linejoin: round;
        opacity: 0.82;
      }
      .hoenn-map-route {
        stroke: #b9d2aa;
        stroke-width: 2;
        stroke-dasharray: 5 7;
        opacity: 0.55;
      }
      .hoenn-map-route.road {
        stroke: #ffe3a3;
        stroke-width: 2.5;
        stroke-dasharray: none;
        opacity: 0.72;
      }
      .hoenn-map-location {
        cursor: pointer;
        outline: none;
      }
      .hoenn-map-location circle {
        fill: #f6f3d5;
        stroke: #2a5271;
        stroke-width: 3;
      }
      .hoenn-map-location.city circle { fill: #ffcf69; }
      .hoenn-map-location.town circle { fill: #d8f49a; }
      .hoenn-map-location.landmark circle { fill: #f4a9a0; }
      .hoenn-map-location.route circle { stroke-width: 2; }
      .hoenn-map-location text,
      .hoenn-player-marker text {
        fill: #fff;
        stroke: #102b41;
        stroke-width: 4px;
        paint-order: stroke;
        font: 700 14px system-ui, sans-serif;
        pointer-events: none;
      }
      .hoenn-map-location.route text {
        fill: #ffe5a8;
        font-size: 12px;
      }
      .hoenn-map-location.selected circle {
        stroke: #fff;
        stroke-width: 4;
        filter: drop-shadow(0 0 4px #fff);
      }
      .hoenn-map-location:focus circle { stroke: #7dd3fc; stroke-width: 5; }
      .hoenn-player-marker { pointer-events: none; }
      .hoenn-player-marker circle {
        fill: rgba(56, 189, 248, 0.24);
        stroke: #38bdf8;
        stroke-width: 4;
      }
      .hoenn-player-marker text { fill: #7dd3fc; }
      .hoenn-map-details {
        display: grid;
        align-content: center;
        gap: 8px;
        padding: 12px;
        border-radius: 9px;
        background: linear-gradient(145deg, #183e60, #102744);
        border: 1px solid rgba(125, 211, 252, 0.55);
      }
      .hoenn-map-details strong { color: #ffe4a3; font-size: 14px; }
      .hoenn-map-details span { color: #d6e7f5; line-height: 1.45; }
      .oras-party-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
        gap: 8px;
      }
      .oras-party-card {
        padding: 8px 10px;
        border-radius: 8px;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        border: 1px solid #334155;
        display: grid;
        gap: 4px;
      }
      .oras-party-card.lead {
        border-color: #65c4ff;
        box-shadow: inset 3px 0 #58baff;
      }
      .oras-bag-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .oras-bag-tabs button.active {
        background: #0284c7;
      }
      .oras-dex-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 8px;
      }
      .oras-dex-summary {
        position: sticky;
        top: 0;
        z-index: 1;
        margin-bottom: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #102d4e;
        color: #dbeafe;
        font-weight: 700;
      }
      .ds-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: #1e293b;
        border: 1px solid #334155;
      }
      .ds-item.caught {
        border-color: #22c55e;
      }
      .ds-item.seen {
        border-color: #38bdf8;
      }
      .oras-time-card {
        min-height: 66px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-radius: 10px;
        background: linear-gradient(120deg, #183d68, #112b4f);
        border: 1px solid rgba(130, 203, 255, 0.55);
      }
      .oras-time-card > span:first-child {
        color: #9bcdf4;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.09em;
      }
      .oras-time-value {
        color: #fff;
        font-size: 27px;
        font-variant-numeric: tabular-nums;
        font-weight: 800;
      }
      .oras-time-date {
        color: #d4e8f9;
        font-size: 11px;
      }
      .hp-bar-track {
        width: 100%;
        min-width: 90px;
        height: 8px;
        border-radius: 999px;
        background: #0f172a;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.35);
      }
      .hp-bar-fill {
        height: 100%;
        transition: width 0.2s ease;
      }
      #dialogue-box {
        display: none;
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: min(720px, calc(100% - 32px));
        padding: 24px 20px 13px;
        border-radius: 12px 12px 7px 7px;
        background: linear-gradient(180deg, #fff, #e8f4ff);
        border: 2px solid #2866a9;
        border-bottom: 5px solid #17477e;
        color: #152f50;
        font-size: 15px;
        line-height: 1.45;
        white-space: pre-line;
        box-shadow: 0 10px 28px rgba(0, 12, 33, 0.48), inset 0 1px #fff;
        z-index: 18;
      }
      .dialogue-name {
        position: absolute;
        top: -13px;
        left: 16px;
        max-width: calc(100% - 32px);
        overflow: hidden;
        padding: 3px 12px;
        border: 2px solid #b9e4ff;
        border-radius: 7px 7px 4px 4px;
        background: linear-gradient(180deg, #3c91d4, #1d5b9a);
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-shadow: 0 3px 7px rgba(0, 23, 59, 0.3);
      }
      .dialogue-prompt {
        display: block;
        margin-top: 8px;
        color: #50779b;
        font-size: 10px;
        font-weight: 700;
        text-align: right;
      }
      #dialogue-box [hidden] { display: none; }
      #dialogue-box.open {
        display: block;
      }
      #battle-overlay,
      #intro-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(6, 11, 25, 0.85);
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 30;
      }
      #battle-overlay {
        background: transparent;
        pointer-events: none;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 12px;
      }
      #battle-overlay.open,
      #intro-overlay.open {
        display: flex;
      }
      #battle-card,
      #intro-card {
        pointer-events: auto;
        width: min(620px, calc(100% - 24px));
        padding: 20px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.96);
        border: 2px solid #38bdf8;
        display: grid;
        gap: 12px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      }
      #battle-card {
        width: min(520px, calc(100% - 24px));
        padding: 9px;
        gap: 7px;
        border: 1px solid rgba(131, 202, 246, 0.78);
        border-radius: 16px;
        background: linear-gradient(145deg, rgba(12, 35, 68, 0.94), rgba(7, 20, 43, 0.94));
        box-shadow: 0 12px 34px rgba(0, 10, 30, 0.52), inset 0 1px rgba(255, 255, 255, 0.12);
      }
      .intro-genders {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .intro-gender-btn {
        padding: 12px;
        border-radius: 10px;
        border: 2px solid #334155;
        background: #1e293b;
        color: #f8fafc;
        font-weight: 700;
        cursor: pointer;
      }
      .intro-gender-btn.active {
        border-color: #38bdf8;
        background: #0369a1;
      }
      #intro-name {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #f8fafc;
        font-size: 14px;
      }
      .intro-primary-btn {
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid #38bdf8;
        background: #0284c7;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      @keyframes truckShake {
        0%,
        100% {
          transform: translateY(0);
        }
        25% {
          transform: translate(-3px, 2px);
        }
        75% {
          transform: translate(3px, -2px);
        }
      }
      .truck-shaking {
        animation: truckShake 0.45s infinite;
      }
      .battle-status-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .battle-row {
        display: grid;
        gap: 4px;
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid rgba(127, 174, 214, 0.28);
        border-radius: 10px;
        background: rgba(25, 48, 78, 0.82);
        font-size: 11px;
      }
      #battle-enemy { border-left: 3px solid #ffb65b; }
      #battle-player { border-left: 3px solid #62c9f4; }
      .battle-combatant-heading {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }
      .battle-combatant-label {
        overflow: hidden;
        color: #9db9d5;
        font-size: 9px;
        font-weight: 800;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .battle-combatant-heading strong { color: #fff; }
      .battle-level {
        margin-left: auto;
        color: #c3d7ec;
        white-space: nowrap;
      }
      .battle-hp-value {
        color: #b8cbe0;
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }
      #battle-log {
        min-height: 23px;
        max-height: 42px;
        overflow-y: auto;
        padding: 5px 8px;
        border-radius: 7px;
        background: rgba(3, 14, 32, 0.42);
        font-size: 11px;
        line-height: 1.35;
        color: #e2edf8;
      }
      #battle-actions {
        display: flex;
        flex-wrap: wrap;
        max-height: 82px;
        overflow-y: auto;
        gap: 5px;
      }
      #battle-actions button {
        flex: 1 1 100px;
        min-height: 34px;
        padding: 6px 9px;
        border-radius: 8px;
        border: 1px solid rgba(139, 203, 245, 0.65);
        background: linear-gradient(180deg, #294d76, #183654);
        color: #f8fafc;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }
      #battle-actions button:hover {
        background: linear-gradient(180deg, #3191d0, #1c68a5);
      }
      #battle-prompt[hidden] { display: none; }
      #battle-prompt:not([hidden]) {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(3, 9, 21, 0.68);
        pointer-events: auto;
      }
      .battle-prompt-card {
        width: min(440px, 100%);
        padding: 18px;
        border: 1px solid rgba(131, 202, 246, 0.9);
        border-radius: 14px;
        background: linear-gradient(145deg, #102d52, #08172c);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
        display: grid;
        gap: 11px;
      }
      #battle-prompt-title { color: #fff; font-size: 17px; }
      #battle-prompt-message { color: #c6d9ec; font-size: 13px; }
      #battle-prompt-actions {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        gap: 7px;
      }
      #battle-prompt-actions button {
        min-height: 38px;
        padding: 7px 10px;
        border: 1px solid rgba(139, 203, 245, 0.72);
        border-radius: 8px;
        background: linear-gradient(180deg, #294d76, #183654);
        color: #f8fafc;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
      }
      #battle-prompt-actions button:hover { background: linear-gradient(180deg, #3191d0, #1c68a5); }
      @media (max-width: 760px) {
        #bottom-screen { padding: 8px 10px; }
        #playnav-bar { align-items: flex-start; }
        #playnav-info { width: 100%; }
        #ds-tabs { width: 100%; justify-content: space-between; gap: 4px; }
        #ds-tabs button { flex: 1 1 68px; min-width: 68px; min-height: 52px; padding: 4px; }
        #battle-overlay { padding: 8px; }
        #battle-card { width: min(460px, calc(100% - 12px)); }
        .battle-status-grid { grid-template-columns: 1fr; }
        .oras-hoenn-map { grid-template-columns: 1fr; }
        .hoenn-map-svg { height: 165px; }
        #ds-panel.hoenn-map-open { max-height: clamp(245px, 42vh, 360px); }
      }
    </style>
  </head>
  <body>
    <div id="ds-shell">
      <div id="top-screen">
        <div id="app"></div>
        <div id="location-banner"><span id="hud-pos">Littleroot Town</span></div>
        <div id="starter-bar">
          <span>Debug Inicial:</span>
          <button data-starter="treecko">Treecko</button>
          <button data-starter="torchic" class="active">Torchic</button>
          <button data-starter="mudkip">Mudkip</button>
          <button id="reset-save" title="Apagar save local">Resetar Save</button>
        </div>
        <div id="dialogue-box" role="dialog" aria-live="polite">
          <span class="dialogue-name" data-dialogue-name hidden></span>
          <span class="dialogue-text" data-dialogue-text></span>
          <span class="dialogue-prompt" data-dialogue-prompt></span>
        </div>
      </div>

      <div id="bottom-screen">
        <div id="playnav-bar">
          <div id="playnav-info">PokéNav Plus · Toque para abrir os seus recursos</div>
          <div id="audio-controls" aria-label="Controles de áudio">
            <label for="audio-volume">Volume</label>
            <input id="audio-volume" type="range" min="0" max="100" step="1" value="60" aria-label="Volume da música" />
            <output id="audio-volume-value" for="audio-volume">60%</output>
            <button id="btn-audio-mute" type="button" aria-label="Silenciar áudio" aria-pressed="false">Silenciar áudio</button>
          </div>
          <div id="ds-tabs">
            <button data-tab="party"><span class="menu-icon" aria-hidden="true">●</span><span class="menu-label">Equipe</span></button>
            <button data-tab="bag"><span class="menu-icon" aria-hidden="true">▣</span><span class="menu-label">Mochila</span></button>
            <button data-tab="pokedex"><span class="menu-icon" aria-hidden="true">⬡</span><span class="menu-label">Pokédex</span></button>
            <button data-tab="map"><span class="menu-icon" aria-hidden="true">⌖</span><span class="menu-label">Mapa</span></button>
            <button data-tab="time"><span class="menu-icon" aria-hidden="true">◷</span><span class="menu-label">Hora</span></button>
            <button id="btn-save-game" aria-label="Salvar Jogo"><span class="menu-icon" aria-hidden="true">▣</span><span class="menu-label">Salvar</span></button>
            <button id="btn-new-game">Novo Jogo</button>
          </div>
        </div>
        <div id="ds-panel" role="region" aria-label="Tela Inferior 3DS"></div>
      </div>
    </div>

    <div id="intro-overlay" role="dialog" aria-modal="true">
      <div id="intro-card"></div>
    </div>

    <div id="battle-overlay" role="dialog" aria-modal="true">
      <div id="battle-card">
        <div class="battle-status-grid">
          <div class="battle-row" id="battle-enemy"></div>
          <div class="battle-row" id="battle-player"></div>
        </div>
        <div id="battle-log"></div>
        <div id="battle-actions"></div>
      </div>
      <div id="battle-prompt" hidden role="dialog" aria-modal="true" aria-labelledby="battle-prompt-title">
        <section class="battle-prompt-card">
          <h2 id="battle-prompt-title"></h2>
          <p id="battle-prompt-message"></p>
